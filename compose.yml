services:
  telegram-bot-api:
    # Official image of the local Bot API server: https://github.com/aiogram/telegram-bot-api
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?}
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"

  bot:
    image: ghcr.io/aneek0/tg-media-downloader:latest
    # Build locally instead of pulling the published image:
    # build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # 2000 MB uploads via the local Bot API server above
      TELEGRAM_API_URL: http://telegram-bot-api:8081
      MAX_UPLOAD_BYTES: 1992294400
      # Override host-specific browser paths from .env; the image includes Chromium and Xvfb.
      CHROME_PATH: /usr/bin/chromium
    # Chromium uses shared memory during ZARZ Turnstile authentication.
    shm_size: "1gb"
    volumes:
      - downloads:/app/DOWNLOADS
      - mornye:/home/app/.mornye
      # gallery-dl OAuth cache (Pixiv login): persists the token written by
      # `docker compose exec bot gallery-dl oauth:pixiv`.
      - gallery-dl-cache:/home/app/.cache/gallery-dl
    depends_on:
      - telegram-bot-api

volumes:
  downloads:
  mornye:
  gallery-dl-cache:
  telegram-bot-api-data:
