[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-url-uploader"
version = "3.3.0"
description = "Telegram bot that uploads direct links and yt-dlp supported media with aiogram."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiogram>=3.31.0,<4",
    "aiohttp>=3.14.3,<4",
    "aiohttp-socks>=0.12.0",
    "gallery-dl>=1.32.13",
    "hachoir>=3.3.0,<4",
    "mutagen>=1.47,<2",
    "python-dotenv>=1.0.1,<2",
    "mornye>=1,<2",
    "pydoll-python==2.27.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "ruff>=0.14.0,<1",
    "ty==0.0.99",
]


[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "ARG",
    "B",
    "BLE",
    "C4",
    "C90",
    "E4",
    "E501",
    "E7",
    "E9",
    "F",
    "I",
    "PL",
    "RUF100",
    "SIM",
]
ignore = ["ARG005", "PLC0415", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 27
max-returns = 11
max-statements = 100


[tool.ty.src]
include = ["app.py", "bot.py", "config.py", "routers", "services", "utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
py-modules = [
    "app",
    "bot",
    "config",
]

[tool.setuptools.packages.find]
include = ["routers*", "services*", "utils*"]

[tool.autopep8]
max_line_length = 150
ignore = "E402,W503,C0116,C0114"
in-place = true
recursive = true
aggressive = 3
